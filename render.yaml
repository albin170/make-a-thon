services:
  # Backend API Web Service on Render
  - type: web
    name: brightloop-api
    env: node
    plan: free
    rootDir: apps/api
    buildCommand: npm install && npx prisma db push --schema=../../prisma/schema.prisma --accept-data-loss && npx ts-node ../../prisma/seed.ts && npm run build
    startCommand: npm run start
    healthCheckPath: /api/docs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false # e.g. https://brightloop-sms.vercel.app


