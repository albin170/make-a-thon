services:
  # Backend API Web Service on Render
  - type: web
    name: brightloop-sms-api
    env: node
    plan: free
    rootDir: ""
    buildCommand: npm ci && npx prisma generate && npx prisma db push --accept-data-loss && npm run build --workspace=apps/api
    startCommand: npm run start --workspace=apps/api
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
